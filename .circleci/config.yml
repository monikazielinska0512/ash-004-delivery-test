version: 2.1

jobs:
  fixture-tests:
    docker:
      - image: cimg/node:22.14.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run offline verifier regressions
          no_output_timeout: 2m
          command: node --test --test-timeout=60000 scripts/verify.test.mjs

workflows:
  fixture-ci:
    jobs:
      - fixture-tests
